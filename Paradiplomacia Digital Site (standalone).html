  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody { margin: 0; background: #16181A; font-family: 'EB Garamond', serif; }\na { color: {{ accentColor }}; text-decoration: none; }\na:hover { color: #FFA35C; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#16181A;color:#ECECEA;min-height:100vh\">\n\n  <div style=\"position:sticky;top:0;z-index:50;background:rgba(22,24,26,0.92);backdrop-filter:blur(8px);border-bottom:1px solid #2C3033;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 28px;overflow-x:auto\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <div style=\"position:relative;width:34px;height:34px;overflow:hidden;flex:none\">\n        <div style=\"position:absolute;transform:scale(0.106);transform-origin:top left;width:320px;height:320px\">\n          <div style=\"position:absolute;left:137px;top:18px;width:46px;height:284px;background:#ECECEA\"><\u002Fdiv>\n          <div style=\"position:absolute;left:137px;top:18px;width:130px;height:120px;background:linear-gradient(135deg,#B9BFC4,#565C61)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:53px;top:182px;width:130px;height:120px;background:linear-gradient(135deg,#5B6167,#1F2224)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:136px;top:136px;width:48px;height:48px;border-radius:50%;background:{{ accentColor }}\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1px;font-size:14px;text-transform:uppercase;white-space:nowrap\">Paradiplomacia Digital<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px;font-size:12.5px;letter-spacing:0.5px;font-weight:700;text-transform:uppercase;flex-shrink:0\">\n      <a href=\"#posicionamento\" style=\"color:#ECECEA;white-space:nowrap\">Posicionamento<\u002Fa>\n      <a href=\"#esg\" style=\"color:#ECECEA;white-space:nowrap\">ESG 2.0<\u002Fa>\n      <a href=\"#odin\" style=\"color:#ECECEA;white-space:nowrap\">ODIN<\u002Fa>\n      <a href=\"#ecossistema\" style=\"color:#ECECEA;white-space:nowrap\">Ecossistema<\u002Fa>\n      <a href=\"https://www.hubstry.dev\" target=\"_blank\" rel=\"noopener\" style=\"padding:7px 12px;border:1px solid {{ accentColor }};color:{{ accentColor }};border-radius:2px;white-space:nowrap\">Hubstry<\u002Fa>\n      <a href=\"https://www.overall720.xyz\" target=\"_blank\" rel=\"noopener\" style=\"padding:7px 12px;background:{{ accentColor }};color:#16181A;border-radius:2px;white-space:nowrap\">Overall 720°<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Hero\" style=\"padding:120px 80px 100px;max-width:1040px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px\">\n    <div style=\"position:relative;width:180px;height:180px;margin-bottom:8px\">\n      <div style=\"position:relative;transform:scale(0.5625);transform-origin:top left;width:320px;height:320px\">\n        <div style=\"position:absolute;left:137px;top:18px;width:46px;height:284px;background:#ECECEA;box-shadow:inset 2px 2px 3px rgba(255,255,255,0.22), inset -3px -3px 6px rgba(0,0,0,0.5), 4px 10px 18px rgba(0,0,0,0.45)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:137px;top:18px;width:130px;height:120px;background:linear-gradient(135deg,#B9BFC4,#838A90,#565C61);box-shadow:inset 2px 2px 3px rgba(255,255,255,0.22), inset -3px -3px 6px rgba(0,0,0,0.5), 4px 10px 18px rgba(0,0,0,0.45)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:53px;top:182px;width:130px;height:120px;background:linear-gradient(135deg,#5B6167,#3A3E42,#1F2224);box-shadow:inset 2px 2px 3px rgba(255,255,255,0.22), inset -3px -3px 6px rgba(0,0,0,0.5), 4px 10px 18px rgba(0,0,0,0.45)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:136px;top:136px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%, {{ accentColor }}, #C24A0E);box-shadow:inset 2px 2px 3px rgba(255,255,255,0.5), inset -3px -3px 5px rgba(0,0,0,0.5), 0 8px 16px rgba(0,0,0,0.55)\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;letter-spacing:3px;font-weight:700;color:{{ accentColor }};text-transform:uppercase\">Overall 720° · Método<\u002Fdiv>\n    <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:56px;line-height:1.05;text-transform:uppercase\">Paradiplomacia Digital<\u002Fdiv>\n    <div style=\"font-size:20px;color:rgba(236,236,234,0.75);max-width:680px;line-height:1.5\">Inteligência territorial e governança verificável para a internacionalização subnacional.<\u002Fdiv>\n    <div style=\"font-size:15px;color:rgba(236,236,234,0.55);max-width:620px;line-height:1.6;border-top:1px solid #2C3033;padding-top:20px;margin-top:8px\">720° — duas voltas completas: de dentro para fora (ativos e capacidades do território) e de fora para dentro (sinais internacionais).<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"posicionamento\" data-screen-label=\"Posicionamento institucional\" style=\"padding:100px 80px;max-width:1040px;margin:0 auto;border-top:1px solid #2C3033\">\n    <div style=\"font-size:13px;letter-spacing:3px;font-weight:700;color:{{ accentColor }};text-transform:uppercase;margin-bottom:16px\">Arquitetura do ecossistema<\u002Fdiv>\n    <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:34px;text-transform:uppercase;margin-bottom:28px;line-height:1.2\">Hubstry → Overall 720° → Paradiplomacia Digital<\u002Fdiv>\n    <div style=\"font-size:17px;line-height:1.7;color:rgba(236,236,234,0.85);margin-bottom:48px\">A Paradiplomacia Digital não é uma vertical de negócio — é o método operacional da vertical Overall 720°: o que a diferencia de uma consultoria genérica de geopolítica. Verticais são definidas por domínio de mercado; métodos, por como se opera nele. Elevar a Paradiplomacia Digital a vertical duplicaria o domínio já ocupado pela Overall 720°, fragmentando o portfólio.<\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:56px\">\n      <div style=\"background:#1E2124;border:1px solid #33373B;padding:20px 32px;text-align:center;min-width:280px\">\n        <div style=\"font-size:11px;letter-spacing:2px;color:rgba(236,236,234,0.5);text-transform:uppercase;margin-bottom:4px\">Holding · Doutrina de 30 anos<\u002Fdiv>\n        <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:20px;text-transform:uppercase\">Hubstry<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:22px;color:{{ accentColor }};padding:6px 0\">↓<\u002Fdiv>\n      <div style=\"background:#1E2124;border:1px solid #33373B;padding:20px 32px;text-align:center;min-width:280px\">\n        <div style=\"font-size:11px;letter-spacing:2px;color:rgba(236,236,234,0.5);text-transform:uppercase;margin-bottom:4px\">Vertical · Inteligência geopolítica e advisory<\u002Fdiv>\n        <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:20px;text-transform:uppercase\">Overall 720°<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:22px;color:{{ accentColor }};padding:6px 0\">↓<\u002Fdiv>\n      <div style=\"background:linear-gradient(135deg,#26282B,#1B1D1F);border:1px solid {{ accentColor }};padding:20px 32px;text-align:center;min-width:280px\">\n        <div style=\"font-size:11px;letter-spacing:2px;color:{{ accentColor }};text-transform:uppercase;margin-bottom:4px\">Método · Ativo intelectual proprietário<\u002Fdiv>\n        <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:20px;text-transform:uppercase\">Paradiplomacia Digital<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #33373B;background:#1B1D1F\">\n      <div sc-camel-on-click=\"{{ toggles.pos }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:22px 28px;cursor:pointer\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:16px;text-transform:uppercase;letter-spacing:0.5px\">Por que método, não vertical — o argumento completo<\u002Fdiv>\n        <div style=\"font-size:22px;color:{{ accentColor }};width:20px;text-align:center\">\n          <sc-if value=\"{{ closed.pos }}\" hint-placeholder-val=\"{{ true }}\">+<\u002Fsc-if>\n          <sc-if value=\"{{ open.pos }}\" hint-placeholder-val=\"{{ false }}\">−<\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ open.pos }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:0 28px 32px;font-size:16px;line-height:1.7;color:rgba(236,236,234,0.8);display:flex;flex-direction:column;gap:16px;border-top:1px solid #2C3033\">\n          <div style=\"padding-top:24px\"><strong style=\"color:#ECECEA\">Escalabilidade sem fragmentação.<\u002Fstrong> Um método pode gerar múltiplas linhas de entrega e segmentos de cliente — governos subnacionais, agências de desenvolvimento, consórcios intermunicipais, empresas em internacionalização — sem novas estruturas societárias.<\u002Fdiv>\n          <div><strong style=\"color:#ECECEA\">Defensabilidade.<\u002Fstrong> Métodos nomeados e documentados viram propriedade intelectual citável (working papers, DOI, Zenodo); verticais não.<\u002Fdiv>\n          <div><strong style=\"color:#ECECEA\">Coerência com o roadmap de 30 anos.<\u002Fstrong> Verticais podem ser desinvestidas; a doutrina atravessa ciclos.<\u002Fdiv>\n          <div style=\"color:rgba(236,236,234,0.6);font-size:15px;border-top:1px solid #2C3033;padding-top:16px\">Exceção registrada: só vira vertical se deixar de ser advisory e virar produto tecnológico — uma plataforma de inteligência territorial (OSINT + camada de dados + painel de governança verificável), mudando o modelo de receita para licença/assinatura. Registrado como opção de spin-off no roadmap, não como estrutura atual.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"esg\" data-screen-label=\"ESG 2.0\" style=\"padding:100px 80px;max-width:1040px;margin:0 auto;border-top:1px solid #2C3033\">\n    <div style=\"font-size:13px;letter-spacing:3px;font-weight:700;color:{{ accentColor }};text-transform:uppercase;margin-bottom:16px\">Moldura conceitual<\u002Fdiv>\n    <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:34px;text-transform:uppercase;margin-bottom:28px;line-height:1.2\">ESG 2.0 e a ponte para a governança subnacional<\u002Fdiv>\n    <div style=\"font-size:17px;line-height:1.7;color:rgba(236,236,234,0.85);margin-bottom:48px\">A ressignificação da sigla por <strong style=\"color:#ECECEA\">Marcos Troyjo<\u002Fstrong> (Marcos Prado Troyjo — economista, cientista político e diplomata, ex-presidente do Novo Banco de Desenvolvimento, hoje em INSEAD e Oxford) — E de Economia, S de Segurança, G de Geopolítica — dá à Paradiplomacia Digital sua moldura de avaliação de decisões: viabilidade econômica, implicações de segurança, leitura geopolítica.<\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin-bottom:16px\">\n      <div style=\"background:#1E2124;border:1px solid {{ accentColor }};padding:14px 20px;font-size:13px;font-weight:700;text-transform:uppercase;text-align:center\">ESG 2.0<\u002Fdiv>\n      <div style=\"color:{{ accentColor }};font-size:20px\">→<\u002Fdiv>\n      <div style=\"background:#1E2124;border:1px solid #33373B;padding:14px 20px;font-size:13px;font-weight:700;text-transform:uppercase;text-align:center\">Segurança econômica<\u002Fdiv>\n      <div style=\"color:{{ accentColor }};font-size:20px\">→<\u002Fdiv>\n      <div style=\"background:#1E2124;border:1px solid #33373B;padding:14px 20px;font-size:13px;font-weight:700;text-transform:uppercase;text-align:center\">GRC<\u002Fdiv>\n      <div style=\"color:{{ accentColor }};font-size:20px\">→<\u002Fdiv>\n      <div style=\"background:#1E2124;border:1px solid #33373B;padding:14px 20px;font-size:13px;font-weight:700;text-transform:uppercase;text-align:center\">Taxonomia SI / Cyber / Infra crítica<\u002Fdiv>\n      <div style=\"color:{{ accentColor }};font-size:20px\">→<\u002Fdiv>\n      <div style=\"background:#1E2124;border:1px solid #33373B;padding:14px 20px;font-size:13px;font-weight:700;text-transform:uppercase;text-align:center\">Crime organizado<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center;font-size:14px;color:rgba(236,236,234,0.5);margin-bottom:56px\">↺ retroalimenta o \"S\" do ESG 2.0 — o ciclo fecha<\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"border:1px solid #33373B;background:#1B1D1F\">\n        <div sc-camel-on-click=\"{{ toggles.esg }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:22px 28px;cursor:pointer\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:16px;text-transform:uppercase;letter-spacing:0.5px\">ESG 2.0 — a ressignificação de Troyjo<\u002Fdiv>\n          <div style=\"font-size:22px;color:{{ accentColor }};width:20px;text-align:center\">\n            <sc-if value=\"{{ closed.esg }}\" hint-placeholder-val=\"{{ true }}\">+<\u002Fsc-if>\n            <sc-if value=\"{{ open.esg }}\" hint-placeholder-val=\"{{ false }}\">−<\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ open.esg }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 28px 32px;font-size:16px;line-height:1.7;color:rgba(236,236,234,0.8);display:flex;flex-direction:column;gap:16px;border-top:1px solid #2C3033\">\n            <div style=\"padding-top:24px\">ESG 1.0 não é descartado — segue \"na cabine\", mas deixou de ser o piloto principal (metáfora do avião de Troyjo). Com menor tensão internacional e segurança alimentar/energética restabelecidas, ESG 1.0 \"volta com tudo\".<\u002Fdiv>\n            <div>O eixo empírico mobilizado é minerais críticos, terras raras, cadeias de suprimento e segurança econômica — convergente com o eixo geo-driven da Paradiplomacia Digital (clima, energia, recursos críticos, reorganização de cadeias).<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #33373B;background:#1B1D1F\">\n        <div sc-camel-on-click=\"{{ toggles.grc }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:22px 28px;cursor:pointer\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:16px;text-transform:uppercase;letter-spacing:0.5px\">Da moldura à execução — a ponte para GRC<\u002Fdiv>\n          <div style=\"font-size:22px;color:{{ accentColor }};width:20px;text-align:center\">\n            <sc-if value=\"{{ closed.grc }}\" hint-placeholder-val=\"{{ true }}\">+<\u002Fsc-if>\n            <sc-if value=\"{{ open.grc }}\" hint-placeholder-val=\"{{ false }}\">−<\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ open.grc }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 28px 32px;font-size:16px;line-height:1.7;color:rgba(236,236,234,0.8);display:flex;flex-direction:column;gap:16px;border-top:1px solid #2C3033\">\n            <div style=\"padding-top:24px\">ESG 2.0 é um framework de avaliação de decisões (macro, geopolítico). GRC é um framework de execução institucional (meso, organizacional).<\u002Fdiv>\n            <div>A ponte entre os dois é a <strong style=\"color:#ECECEA\">segurança econômica<\u002Fstrong> — é ela que traduz o \"S\" em obrigações concretas de governança, apetite a risco e conformidade.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #33373B;background:#1B1D1F\">\n        <div sc-camel-on-click=\"{{ toggles.tax }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:22px 28px;cursor:pointer\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:16px;text-transform:uppercase;letter-spacing:0.5px\">Taxonomia da segurança — três camadas<\u002Fdiv>\n          <div style=\"font-size:22px;color:{{ accentColor }};width:20px;text-align:center\">\n            <sc-if value=\"{{ closed.tax }}\" hint-placeholder-val=\"{{ true }}\">+<\u002Fsc-if>\n            <sc-if value=\"{{ open.tax }}\" hint-placeholder-val=\"{{ false }}\">−<\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ open.tax }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 28px 32px;border-top:1px solid #2C3033\">\n            <div style=\"display:grid;grid-template-columns:280px 1fr;gap:0;margin-top:24px;font-size:15px;line-height:1.6\">\n              <div style=\"padding:14px 16px 14px 0;font-weight:700;color:#ECECEA;border-top:1px solid #2C3033\">Segurança da Informação<\u002Fdiv>\n              <div style=\"padding:14px 0;color:rgba(236,236,234,0.8);border-top:1px solid #2C3033\">Campo maior — protege a informação em qualquer suporte (papel, pessoas, processos, ativos digitais).<\u002Fdiv>\n              <div style=\"padding:14px 16px 14px 0;font-weight:700;color:#ECECEA;border-top:1px solid #2C3033\">Cibersegurança<\u002Fdiv>\n              <div style=\"padding:14px 0;color:rgba(236,236,234,0.8);border-top:1px solid #2C3033\">Vertical / subconjunto — restrita ao ciberespaço e a sistemas conectados.<\u002Fdiv>\n              <div style=\"padding:14px 16px 14px 0;font-weight:700;color:{{ accentColor }};border-top:1px solid #2C3033\">Segurança cibernética nacional / infra crítica<\u002Fdiv>\n              <div style=\"padding:14px 0;color:rgba(236,236,234,0.8);border-top:1px solid #2C3033\">Camada geopolítica — onde o tema deixa de ser corporativo e vira geopolítica: ponto de retorno ao ESG 2.0.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:14px;color:rgba(236,236,234,0.55);margin-top:20px;line-height:1.6\">Hierarquia da tradição ISO/ABNT (ISO/IEC 27000 e correlatas). Parte da literatura anglófona trata \"cybersecurity\" como campo autônomo e mais amplo, incluindo sistemas ciberfísicos — nominar a fonte da taxonomia adotada blinda o argumento.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #33373B;background:#1B1D1F\">\n        <div sc-camel-on-click=\"{{ toggles.crime }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:22px 28px;cursor:pointer\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:16px;text-transform:uppercase;letter-spacing:0.5px\">Crime organizado como vetor nominado<\u002Fdiv>\n          <div style=\"font-size:22px;color:{{ accentColor }};width:20px;text-align:center\">\n            <sc-if value=\"{{ closed.crime }}\" hint-placeholder-val=\"{{ true }}\">+<\u002Fsc-if>\n            <sc-if value=\"{{ open.crime }}\" hint-placeholder-val=\"{{ false }}\">−<\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ open.crime }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 28px 32px;font-size:16px;line-height:1.7;color:rgba(236,236,234,0.8);display:flex;flex-direction:column;gap:16px;border-top:1px solid #2C3033\">\n            <div style=\"padding-top:24px\"><strong style=\"color:#ECECEA\">Ator territorial e transnacional ao mesmo tempo.<\u002Fstrong> Facções operam com lógica de controle territorial subnacional e cadeias logísticas internacionais — plano de análise da paradiplomacia, não do estatal-central.<\u002Fdiv>\n            <div><strong style=\"color:#ECECEA\">Já migrou para o vetor cibernético e a economia formal.<\u002Fstrong> Ransomware, fraude, lavagem via ativos virtuais, infiltração em cadeias de suprimento e licitações — conecta diretamente a compliance, due diligence e integridade.<\u002Fdiv>\n            <div><strong style=\"color:#ECECEA\">Risco reputacional de atração de investimento.<\u002Fstrong> Um território percebido como capturado perde capacidade de internacionalização.<\u002Fdiv>\n            <div style=\"background:#26201A;border:1px solid {{ accentColor }};padding:16px 20px;font-size:15px;color:rgba(236,236,234,0.9);margin-top:8px\">Tratamento necessário: vetor de risco estrutural mapeável — com indicadores, governança e verificabilidade — não tema securitário-alarmista.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"odin\" data-screen-label=\"ODIN\" style=\"padding:100px 80px;max-width:1040px;margin:0 auto;border-top:1px solid #2C3033\">\n    <div style=\"font-size:13px;letter-spacing:3px;font-weight:700;color:{{ accentColor }};text-transform:uppercase;margin-bottom:16px\">Linha de entrega<\u002Fdiv>\n    <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:34px;text-transform:uppercase;margin-bottom:28px;line-height:1.2\">ODIN — a primeira materialização do método<\u002Fdiv>\n    <div style=\"font-size:17px;line-height:1.7;color:rgba(236,236,234,0.85);margin-bottom:20px\">O ODIN é a primeira materialização das linhas de entrega da Overall 720°, operando como produto de superfície do método, com três funções simultâneas:<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:56px\">\n      <div style=\"background:#1E2124;border:1px solid #33373B;padding:24px\">\n        <div style=\"font-size:12px;letter-spacing:1.5px;color:{{ accentColor }};text-transform:uppercase;font-weight:700;margin-bottom:10px\">Prova de método<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.6;color:rgba(236,236,234,0.8)\">Separação explícita entre Fontes Primárias (3º Documento China–ALC, Tesouro Nacional, WAICO, Conselho da UE, Câmara e Senado) e Cobertura (WaPo, CNN, Reuters, Korea Herald).<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1E2124;border:1px solid #33373B;padding:24px\">\n        <div style=\"font-size:12px;letter-spacing:1.5px;color:{{ accentColor }};text-transform:uppercase;font-weight:700;margin-bottom:10px\">Topo de funil<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.6;color:rgba(236,236,234,0.8)\">Ativo de aquisição e credibilidade para o advisory: curadoria setorial sob demanda e Fractional CTO por projeto.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1E2124;border:1px solid #33373B;padding:24px\">\n        <div style=\"font-size:12px;letter-spacing:1.5px;color:{{ accentColor }};text-transform:uppercase;font-weight:700;margin-bottom:10px\">Ativo de cadência<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.6;color:rgba(236,236,234,0.8)\">Edições periódicas com marcação de turno — periodicidade que converte framework intelectual em capacidade operacional comprovada.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:18px;text-transform:uppercase;margin-bottom:20px\">Uma trajetória de expansão em 720°<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px;margin-bottom:48px\">\n      <div style=\"flex:1;min-width:280px;background:#1E2124;border:1px solid #33373B;padding:24px\">\n        <div style=\"font-size:12px;letter-spacing:1.5px;color:rgba(236,236,234,0.55);text-transform:uppercase;font-weight:700;margin-bottom:10px\">Em operação · 360° · De fora para dentro<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7;color:rgba(236,236,234,0.8)\">Sinais internacionais, geopolítica, geoeconomia, cadeias, janelas regulatórias.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-size:24px;color:{{ accentColor }}\">→<\u002Fdiv>\n      <div style=\"flex:1;min-width:280px;background:linear-gradient(135deg,#26282B,#1B1D1F);border:1px solid {{ accentColor }};padding:24px\">\n        <div style=\"font-size:12px;letter-spacing:1.5px;color:{{ accentColor }};text-transform:uppercase;font-weight:700;margin-bottom:10px\">Em expansão · +360° · De dentro para fora<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7;color:rgba(236,236,234,0.9)\">Inventário de ativos e capacidades do território, com personalização por território.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#1E2124;border:1px solid #33373B;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n      <div>\n        <div style=\"font-size:12px;letter-spacing:1.5px;color:{{ accentColor }};text-transform:uppercase;font-weight:700;margin-bottom:6px\">Edição 16<\u002Fdiv>\n        <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:18px;text-transform:uppercase\">O vácuo e a rota: a estratégia da China no atrito EUA–Brasil<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"https://odin-intelligence-news.onrender.com/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:14px;font-weight:700;flex:none\">Ler Edição 16 ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"ecossistema\" data-screen-label=\"Ecossistema\" style=\"padding:100px 80px;max-width:1040px;margin:0 auto;border-top:1px solid #2C3033\">\n    <div style=\"font-size:13px;letter-spacing:3px;font-weight:700;color:{{ accentColor }};text-transform:uppercase;margin-bottom:16px\">Rede<\u002Fdiv>\n    <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:34px;text-transform:uppercase;margin-bottom:40px;line-height:1.2\">Ecossistema<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n      <a href=\"https://www.hubstry.dev\" target=\"_blank\" rel=\"noopener\" style=\"display:block;background:#1E2124;border:1px solid #33373B;padding:32px;color:#ECECEA\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:22px;text-transform:uppercase;margin-bottom:8px\">Hubstry<\u002Fdiv>\n        <div style=\"font-size:14px;color:rgba(236,236,234,0.6);margin-bottom:16px\">Holding · doutrina de 30 anos<\u002Fdiv>\n        <div style=\"font-size:14px;color:{{ accentColor }};font-weight:700\">www.hubstry.dev ↗<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"https://www.overall720.xyz\" target=\"_blank\" rel=\"noopener\" style=\"display:block;background:#1E2124;border:1px solid #33373B;padding:32px;color:#ECECEA\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:22px;text-transform:uppercase;margin-bottom:8px\">Overall 720°<\u002Fdiv>\n        <div style=\"font-size:14px;color:rgba(236,236,234,0.6);margin-bottom:16px\">Vertical · inteligência geopolítica e advisory<\u002Fdiv>\n        <div style=\"font-size:14px;color:{{ accentColor }};font-weight:700\">www.overall720.xyz ↗<\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid #2C3033;padding:48px 80px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:1.5px;font-size:15px;letter-spacing:1px;text-transform:uppercase\">Paradiplomacia Digital | Overall 720°<\u002Fdiv>\n    <div style=\"display:flex;gap:24px;font-size:14px\">\n      <a href=\"https://www.hubstry.dev\" target=\"_blank\" rel=\"noopener\">hubstry.dev<\u002Fa>\n      <a href=\"https://www.overall720.xyz\" target=\"_blank\" rel=\"noopener\">overall720.xyz<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF7A29&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#FF7A29&quot;,&quot;#E8590C&quot;,&quot;#FF9450&quot;]}}\">\nclass Component extends DCLogic {\n  state = { open: { pos: false, esg: false, grc: false, tax: false, crime: false, odinRess: false } };\n\n  toggle(key) {\n    this.setState(s => ({ open: { ...s.open, [key]: !s.open[key] } }));\n  }\n\n  renderVals() {\n    const open = this.state.open;\n    const closed = {};\n    Object.keys(open).forEach(k => { closed[k] = !open[k]; });\n    const toggles = {};\n    Object.keys(open).forEach(k => { toggles[k] = () => this.toggle(k); });\n    return {\n      accentColor: this.props.accentColor ?? '#FF7A29',\n      open,\n      closed,\n      toggles\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
